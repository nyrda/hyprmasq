type = "computer_driver"
module = "driver.py:HyprmasqDriver"
port = 18765

[install."linux/omarchy"]
python = "requirements-omarchy.txt"
downloads = [
    { url = "https://github.com/nyrda/hyprmasq/archive/refs/tags/v0.5.1.tar.gz", sha256 = "e2af12f26157a56c72d7e0f8c5050fa2b03067846b8f32baaf6c6cb2c0a27e49", to = "hyprmasq-src.tar.gz", arch = "amd64" },
    { url = "https://github.com/nyrda/hyprmasq/releases/download/v0.5.1/hyprmasq-0.5.1-x86_64.tar.gz", sha256 = "812d49f5bd8addf7e07c7d4c785322cc397fc1fc7d0188ed2290bfff280be7d0", to = "hyprmasq-tools.tar.gz", arch = "amd64" },
]
run = [{ script = "install-hyprland.sh" }]
services = [
    { name = "driver", command = "venv/bin/python -m agentenv_protocol.computer.serve driver.py:HyprmasqDriver" },
]

[[known_failures."linux/omarchy"]]
check = "P6"
name = "Unicode and mixed-case text arrives whole"
reason = "computer_type (disabled for agents under tools=driver) uses hyprmasq-input for ASCII and wtype for non-ASCII on the active probe window; CJK codepoints are dropped under fcitx5 while ASCII, Latin-1, chords, whitespace and clipboard isolation all pass"
