<svg xmlns="http://www.w3.org/2000/svg" width="880" height="310" viewBox="0 0 880 310" role="img" aria-label="CuaDriverBench on Omarchy 4.5 across 280 trials (Claude Sonnet 5.5 and GPT-6.2 Sol): pass rate with 95 % Wilson interval on all 70 trials, background pass bar, and wall time, tool calls and list-price cost as multiples of hyprmasq 0.5.1.">
