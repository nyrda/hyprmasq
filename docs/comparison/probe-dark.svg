<svg xmlns="http://www.w3.org/2000/svg" width="880" height="438" viewBox="0 0 880 438" role="img" aria-label="Tools compared on the same tasks: a row per tool for each agent, with the share of its runs that passed, the median time, and the median uncached input, peak context, cost per run and seconds the user was disturbed.">
<title>Tools compared on the same tasks: a row per tool for each agent, with the share of its runs that passed, the median time, and the median uncached input, peak context, cost per run and seconds the user was disturbed.</title>
<style>text{font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;font-variant-numeric:tabular-nums}.t{fill:#f0f6fc}.t2{fill:#9198a1}.m{fill:#7d8590}.bg{fill:#0d1117;stroke:#3d444d}.grid{stroke:#1c2128;stroke-width:1}.axis{stroke:#3d444d;stroke-width:1}.tools{fill:#3987e5}.out{fill:#454c56}.dot{fill:#d1d7e0;stroke:#0d1117;stroke-width:1.5}.miss{fill:#0d1117;stroke:#f85149;stroke-width:1.75}.pass{fill:#3fb950}.fail{fill:#0d1117;stroke:#f85149;stroke-width:1.75}.cut{stroke:#0d1117;stroke-width:2}.s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#199e70}.s3{fill:#c98500}.s4{fill:#d55181}.s5{fill:#008300}.s6{fill:#9085e9}.s7{fill:#e66767}</style>
<rect x="0.5" y="0.5" width="879" height="437" rx="6" class="bg"/>
<text x="24" y="34" class="t" font-size="15" font-weight="600">Tools compared on the same tasks</text>
<text x="24" y="53" class="t2" font-size="12.5">The first bar is the share of runs that passed, with the count and the passed runs&#x27; median time. The other</text>
<text x="24" y="72" class="t2" font-size="12.5">bars have a scale each: tokens and cost are medians over all runs. User disturbed counts the passed runs</text>
<text x="24" y="91" class="t2" font-size="12.5">that took the focus or drew over the user&#x27;s window, and its bar is their median seconds.</text>
<text x="24" y="110" class="t2" font-size="12.5">Each row pools the runs of every task that the agent ran with hyprmasq and with the other tools.</text>
