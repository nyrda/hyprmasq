<text x="24" y="34" class="t" font-size="15" font-weight="600">Four tools, the same 16 tasks</text>
<text x="24" y="53" class="t2" font-size="12.5">Six runs per task and agent. The dot is the pass rate and the line its 95 % interval: where two lines</text>
<text x="24" y="72" class="t2" font-size="12.5">overlap, the difference may be chance. Under each tool is where it is built to work. Time and cost are</text>
<text x="24" y="91" class="t2" font-size="12.5">multiples of hyprmasq&#x27;s on the same task.</text>
