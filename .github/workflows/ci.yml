name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # The flake pins Hyprland's own flake, whose packages hyprland.cachix.org has prebuilt.
          extra_nix_config: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      # Hyprland's derivation reads the VERSION file of its source, which nix flake check --no-build does not copy.
      - name: Instantiate Hyprland
        run: nix eval --raw .#hyprland.drvPath
      - name: Evaluate flake
        run: nix flake check --no-build
      - name: Build plugin and MCP server (including Go tests)
        run: nix build .#hyprmasq .#hyprmasq-mcp -L
      - name: Check the VM test's areas and subtest tables
        run: nix build .#checks.x86_64-linux.vm-test-docs -L
      - name: Check C, C++ and Go formatting
        run: |
          # The variables expand in the inner Bash process.
          # shellcheck disable=SC2016
          nix develop -c bash -euo pipefail -c '
            git ls-files -z -- "src/*.cpp" "src/*.hpp" "src/*.c" "src/*.h" "tools/*.c" "tools/*.h" "nix/*.c" |
              xargs -0 clang-format --dry-run -Werror
            files=$(gofmt -l mcp)
            if [[ -n "$files" ]]; then
              printf "%s\n" "$files"
              exit 1
            fi
          '
      - name: Bench unit tests
        run: |
          python3 bench/analyze_test.py
          python3 bench/dispatch_test.py
          python3 bench/harness_test.py
          python3 bench/laptop/run_form_test.py
          python3 bench/laptop/run_mac_form_test.py
          python3 bench/tasks/board/check_test.py
          python3 bench/tasks/files/check_test.py
          python3 bench/tasks/form/check_test.py
          python3 bench/tasks/trace/check_test.py
          python3 bench/render_test.py
      - name: Check the benchmark page against its data
        run: python3 bench/render.py --check
  go-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          # The dev shell has the plugin's inputs, Hyprland among them, from hyprland.cachix.org.
          extra_nix_config: |
            extra-substituters = https://hyprland.cachix.org
            extra-trusted-public-keys = hyprland.cachix.org-1:a7pgxzMz7+chwVL3/pzj6jIBMioiJM7ypFP8PwtkuGc=
      # The package build runs the Go tests with -short, which skips the ones that wait on real time.
      - name: Go tests, all of them
        run: nix develop -c bash -euo pipefail -c 'cd mcp && go test ./...'
      - name: Go tests with the race detector
        run: nix develop -c bash -euo pipefail -c 'cd mcp && go test -race ./...'
  calc-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Calc checker unit tests (LibreOffice)
        run: nix-build bench/tasks/calc/check-test.nix
