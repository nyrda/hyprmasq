<text x="186" y="103" class="m" font-size="10.5">passed runs</text>
<text x="409.3" y="88" class="t2" font-size="12" font-weight="600">Focus away</text>
<text x="409.3" y="103" class="m" font-size="10.5">median, passed runs</text>
<text x="632.7" y="88" class="t2" font-size="12" font-weight="600">Lost the user&#x27;s typing</text>
<text x="632.7" y="103" class="m" font-size="10.5">runs of the Forgejo task</text>
