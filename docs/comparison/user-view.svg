<text x="24" y="34" class="t" font-size="15" font-weight="600">What the user saw while the agent worked</text>
<text x="24" y="53" class="t2" font-size="12.5">The user types in their own window while the agent works on another workspace. Under each tool is where</text>
<text x="24" y="72" class="t2" font-size="12.5">it is built to work. A row holds its runs with both agents, and an empty bar means it never happened.</text>
